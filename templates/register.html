
{% extends "layout.html" %}

{% block title %}
    Patient Registration
{% endblock %}

{% block main %}

<div class="register-container">

    <h1>Patient Registration</h1>
    <p class="subtitle">Create Your Account</p>

    <form action="/register" method="post">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="number"
            name="age"
            placeholder="Age"
            min="1"
            max="120"
            required
        >

        <input
            type="number"
            name="height"
            placeholder="Height (cm)"
            min="1"
            step="0.1"
            required
        >

        <input
            type="number"
            name="weight"
            placeholder="Weight (kg)"
            min="1"
            step="0.1"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            name="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <input
            type="password"
            name="repassword"
            placeholder="Retype Password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit" class="register-submit">
            Register
        </button>

    </form>

    <p class="login-text">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

{% endblock %}
